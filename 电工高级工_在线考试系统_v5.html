  document.getElementById('wrongpanel').style.display='none';
  scrollTo({top:0,behavior:'smooth'});
}
function masterRemove(id){
  removeWrongId(id);SHOWN=SHOWN.filter(x=>x!==id);delete ST[id];delete SEL[id];
  renderList();updateScore();updateWrongBtn();
}
function clearWrongAll(){
  if(!confirm('清空全部错题记录？此操作不可恢复。'))return;
  saveWrong([]);updateWrongBtn();renderWrongPanel();
  if(wrongMode){SHOWN=[];renderList();updateScore();}
}
function cardInner(q,seq){
  const st=ST[q.id];const sel=SEL[q.id]||[];
  let opts=q.options.map(o=>{
    let cls='opt';
    if(st){cls+=' lock';const inAns=q.answer.indexOf(o.l)>=0;const picked=st.given.indexOf(o.l)>=0;
      if(inAns)cls+=' ok';else if(picked)cls+=' bad';}
    else if(sel.indexOf(o.l)>=0)cls+=' sel';
    const key=o.l==='正确'?'√':o.l==='错误'?'×':o.l;
    return `<div class="${cls}" onclick="pick(${q.id},'${o.l}')"><span class="k">${key}</span><span>${esc(o.t)}</span></div>`;
  }).join('');
  let extra='';
  if(q.type==='多选题'&&!st)extra=`<button class="btn sm" onclick="submitMulti(${q.id})">确定</button>`;
  let fb='',rm='';
  if(st){
    const cls=st.correct?'ok':'bad';
    const head=st.correct?'✓ 回答正确':'✗ 回答错误';
    const body=ansBlock(q,st.given,st.correct);
    const note=q.note?`<div class="note">${q.corrected?'<span class=corr>答案已订正</span> ':'💡 '}${esc(q.note)}</div>`:'';
    fb=`<div class="fb ${cls}"><span class="big">${head}</span>${body}${note}</div>`;
    if(wrongMode&&st.correct)rm=`<div class="rmbtn"><button class="btn gray sm" onclick="masterRemove(${q.id})">✓ 已掌握，移出错题本</button></div>`;
  }
  return `<div class="qmeta"><span class="seq">${seq}</span>${typeTag(q.type)}<span class="tag topic">${q.topic}</span>`+
    `<span>原题号 ${q.type.slice(0,2)}${q.num}</span>${q.corrected?'<span class=corr>订正题</span>':''}${q.noOpt?'<span class=corr>原题无正确项</span>':''}</div>`+
    `<div class="qtext">${esc(q.stem)||'（判断）'}</div>${opts}${extra}${fb}${rm}`;
}
function exitWrongMode(){applyFilter();}
function renderList(){
  let banner='';
  if(wrongMode)banner=`<div class="modebanner"><span>📕 错题卷 · 仅含错题（${SHOWN.length} 道）</span><button class="btn gray sm" onclick="exitWrongMode()">退出错题卷</button></div>`;
  if(wrongMode&&!SHOWN.length){document.getElementById('list').innerHTML=banner+`<div class="qcard" style="text-align:center;color:var(--muted)">错题本已清空 🎉</div>`;return;}
  const html=SHOWN.map((id,i)=>`<div class="qcard" id="w_${id}">${cardInner(qById(id),i+1)}</div>`).join('');
  document.getElementById('list').innerHTML=banner+html;
}
function repaint(id){
  const i=SHOWN.indexOf(id);
  document.getElementById('w_'+id).innerHTML=cardInner(qById(id),i+1);
}
function pick(id,l){
  const q=qById(id);if(ST[id])return;
  if(q.type==='多选题'){SEL[id]=SEL[id]||[];const k=SEL[id].indexOf(l);if(k>=0)SEL[id].splice(k,1);else SEL[id].push(l);repaint(id);}
  else judge(id,l);
}
function submitMulti(id){const s=SEL[id]||[];if(!s.length){alert('请至少选择一项');return}judge(id,normSel(s));}
function judge(id,given){
  const q=qById(id);
  const correct=q.type==='多选题'?(normSel(given.split(''))===normSel(q.answer.split(''))):(given===q.answer);
  ST[id]={given:given,correct:correct};
  if(!correct){logWrong(id);updateWrongBtn();}
  repaint(id);updateScore();
}
function updateScore(){
  let done=0,ok=0;SHOWN.forEach(id=>{if(ST[id]){done++;if(ST[id].correct)ok++}});
  const total=SHOWN.length,bad=done-ok,rate=done?Math.round(ok/done*100):0;
  document.getElementById('s_total').textContent=total;
  document.getElementById('s_done').textContent=done;
  document.getElementById('s_ok').textContent=ok;
  document.getElementById('s_bad').textContent=bad;
  document.getElementById('s_rate').textContent=rate+'%';
  document.getElementById('s_pi').style.width=(total?done/total*100:0)+'%';
}
function resetAll(){
  if(!confirm('清空本卷已作答记录，重新答题？'))return;
  SHOWN.forEach(id=>{delete ST[id];delete SEL[id]});
  renderList();updateScore();scrollTo({top:0});
}

/* ---------------- 导入数据（JSON） ---------------- */
function importData(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let recs=null;
    try{
      const obj=JSON.parse(e.target.result);
      if(Array.isArray(obj))recs=obj;
      else if(obj&&Array.isArray(obj.records))recs=obj.records;
      else if(obj&&Array.isArray(obj.data))recs=obj.data;
    }catch(err){alert('导入失败：不是有效的 JSON 文件。');input.value='';return;}
    if(!recs){alert('导入失败：文件里找不到错题记录（records 数组）。');input.value='';return;}
    const clean=recs.filter(r=>r&&typeof r.id==='number').map(r=>({id:r.id,ts:(typeof r.ts==='number'?r.ts:Date.now())}));
    if(!clean.length){alert('导入失败：没有有效的错题记录。');input.value='';return;}
    const cur=loadWrong();
    const merge=confirm('共读取 '+clean.length+' 条错题记录。\n\n【确定】= 合并到本机现有错题本（自动去重）\n【取消】= 覆盖本机现有错题本');
    let result;
    if(merge){
      const seen=new Set(cur.map(r=>r.id+'|'+r.ts));
      result=cur.slice();
      clean.forEach(r=>{const k=r.id+'|'+r.ts; if(!seen.has(k)){seen.add(k);result.push(r);}});
    }else{ result=clean; }
    saveWrong(result); updateWrongBtn();
    if(document.getElementById('wrongpanel').style.display!=='none')renderWrongPanel();
    input.value='';
    alert('导入成功！当前错题本共 '+wrongIds().length+' 道题（'+result.length+' 条记录）。');
  };
  reader.readAsText(f,'utf-8');
}

/* ---------------- 通用下载 ---------------- */
function dl(content,mime,filename){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* ===================== v2 计时与答题速度统计 ===================== */
let quizStart=null, quizTimer=null, quizStartDone=0, quizStartOk=0;
function totalAnswered(){return Object.keys(ST).length;}
function totalOk(){let n=0;for(const k in ST)if(ST[k].correct)n++;return n;}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function tickQuiz(){const el=document.getElementById('qtimer');if(quizStart&&el)el.textContent='⏱ '+fmtClock((Date.now()-quizStart)/1000);}
function startQuiz(){
  quizStart=Date.now();quizStartDone=totalAnswered();quizStartOk=totalOk();
  document.getElementById('btnStart').style.display='none';
  document.getElementById('btnEnd').style.display='';
  const t=document.getElementById('qtimer');t.style.display='';t.textContent='⏱ 00:00';
  document.getElementById('speedpanel').style.display='none';
  if(quizTimer)clearInterval(quizTimer);quizTimer=setInterval(tickQuiz,1000);
}
function spCard(label,big,sub){return `<div class="sp-card"><div class="sp-l">${label}</div><div class="sp-b">${big}</div><div class="sp-s">${sub}</div></div>`;}
function endQuiz(){
  if(!quizStart){alert('请先点「▶ 开始答题」。');return;}
  if(quizTimer){clearInterval(quizTimer);quizTimer=null;}
  const elapsedSec=(Date.now()-quizStart)/1000; quizStart=null;
  const done=Math.max(0,totalAnswered()-quizStartDone);
  const ok=Math.max(0,totalOk()-quizStartOk);
  document.getElementById('btnEnd').style.display='none';
  document.getElementById('btnStart').style.display='';
  document.getElementById('qtimer').style.display='none';
  const sp=document.getElementById('speedpanel');
  const mins=elapsedSec/60;
  let body;
  if(done<=0){
    body=`<div class="sp-h">⏱ 本次答题统计</div><div class="sp-row">用时 <b>${fmtClock(elapsedSec)}</b>（${mins.toFixed(1)} 分钟），但本次没有作答新题目，无法计算速度。<br>提示：点「开始答题」后再去作答；若想重新计时整卷，可先「重做本卷」再「开始答题」。</div>`;
  }else{
    const perQ=mins/done, qpm=done/mins, secQ=elapsedSec/done;
    body=`<div class="sp-h">⏱ 本次答题统计</div>`+
      `<div class="sp-grid">`+
        spCard('用时',fmtClock(elapsedSec),`${mins.toFixed(1)} 分钟`)+
        spCard('本次作答',`${done} 题`,`${ok} 对 / ${done-ok} 错（${Math.round(ok/done*100)}%）`)+
        spCard('每题用时',`${perQ.toFixed(2)} 分/题`,`${secQ.toFixed(1)} 秒/题`)+
        spCard('每分钟',`${qpm.toFixed(1)} 题`,'1 分钟可答')+
        spCard('每 5 分钟',`${(qpm*5).toFixed(1)} 题`,'5 分钟可答')+
        spCard('每 90 分钟',`${Math.round(qpm*90)} 题`,'90 分钟可答（常见考试时长）')+
      `</div>`+
      `<div class="sp-tip">换算均按本次平均速度（${done} 题 ÷ ${mins.toFixed(1)} 分钟 = ${qpm.toFixed(2)} 题/分）推算，仅供参考。</div>`;
  }
  sp.innerHTML=body;sp.style.display='block';sp.scrollIntoView({behavior:'smooth',block:'start'});
}

  return pool;
}
function renderNonWrongPanel(){
  const total=QUESTIONS.length, wcnt=wrongIds().length, remain=total-wcnt;
  const cAll=nonWrongPool('all').length;
  const c1=nonWrongPool('单选题').length, c2=nonWrongPool('多选题').length, c3=nonWrongPool('判断题').length;
  const html=`<div class="nw-head">✅ 非错题考试（题库 − 错题本）</div>
    <div class="nw-sub">题库共 <b>${total}</b> 题，错题本 <b>${wcnt}</b> 题，剔除后剩余可考 <b style="color:#047857">${remain}</b> 题。
    若要用别人/别的电脑的错题本，先点顶栏「⬆ 导入数据」载入，再选下面任一项开始（按当前「顺序 / 随机」设置出题）。</div>
    <div class="nw-actions">
      <button class="btn sm" onclick="loadNonWrong('all')">全部非错题（${cAll}）</button>
      <button class="btn sm" style="background:#2563eb" onclick="loadNonWrong('单选题')">仅单选（${c1}）</button>
      <button class="btn sm" style="background:#7c3aed" onclick="loadNonWrong('多选题')">仅多选（${c2}）</button>
      <button class="btn sm" style="background:#0e7490" onclick="loadNonWrong('判断题')">仅判断（${c3}）</button>
    </div>
    <div class="hint">「非错题卷」用于专攻你还没做错过的题、巩固已掌握部分或考前查漏。作答时若答错，仍会自动收进错题本。</div>`;
  document.getElementById('nonwrongpanel').innerHTML=html;
}
function toggleNonWrongPanel(){
  const p=document.getElementById('nonwrongpanel');
  const wp=document.getElementById('wrongpanel'); if(wp)wp.style.display='none';
  if(p.style.display==='none'){renderNonWrongPanel();p.style.display='block';p.scrollIntoView({behavior:'smooth',block:'start'});}
  else p.style.display='none';
}
function loadNonWrong(type){
  let ids=nonWrongPool(type).map(q=>q.id);
  if(!ids.length){alert(type==='all'?'没有可考的非错题——错题本可能已包含全部题目。':'该题型没有可考的非错题。');return;}
  ids.forEach(id=>{delete ST[id];delete SEL[id];});
  if(document.getElementById('order').value==='rand')ids=shuffle(ids);
  SHOWN=ids; wrongMode=false; nonWrongMode=true;
  nonWrongTypeLabel = (type==='all'?'· 全部题型':'· 仅'+type.slice(0,2));
  renderList(); updateScore();
  document.getElementById('nonwrongpanel').style.display='none';
  const wp=document.getElementById('wrongpanel'); if(wp)wp.style.display='none';
  scrollTo({top:0,behavior:'smooth'});
}
function exitNonWrong(){applyFilter();}

/* 覆盖 renderList：支持「非错题卷」横幅；进入错题卷时清掉非错题标记 */
function renderList(){
  let banner='';
  if(wrongMode){
    nonWrongMode=false;
    banner=`<div class="modebanner"><span>📕 错题卷 · 仅含错题（${SHOWN.length} 道）</span><button class="btn gray sm" onclick="exitWrongMode()">退出错题卷</button></div>`;
  }else if(nonWrongMode){
    banner=`<div class="modebanner" style="background:#ecfdf5;border-color:#6ee7b7;color:#047857"><span>✅ 非错题卷 · 已剔除错题本中的题（${SHOWN.length} 道 ${nonWrongTypeLabel}）</span><button class="btn gray sm" onclick="exitNonWrong()">退出</button></div>`;
  }
  if(wrongMode&&!SHOWN.length){document.getElementById('list').innerHTML=banner+`<div class="qcard" style="text-align:center;color:var(--muted)">错题本已清空 🎉</div>`;return;}
  const html=SHOWN.map((id,i)=>`<div class="qcard" id="w_${id}">${cardInner(qById(id),i+1)}</div>`).join('');
  document.getElementById('list').innerHTML=banner+html;
}

/* 覆盖 applyFilter：切换题型/知识点时同时退出非错题卷并收起其面板 */
function applyFilter(){
  wrongMode=false; nonWrongMode=false;
  document.getElementById('wrongpanel').style.display='none';
  const nw=document.getElementById('nonwrongpanel'); if(nw)nw.style.display='none';
  SHOWN=currentList().map(q=>q.id);
  renderList();updateScore();scrollTo({top:0});
}

initControls();applyFilter();updateWrongBtn();
</script>
</body>
</html>
